# Непрерывная интеграция: линтеры, проверка типов, модульные и e2e-тесты,
# тесты решателя и сборка Docker-образов. Используется также workflow «Release».
name: CI

on:
  push:
    branches-ignore: [main, master]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      docker:
        description: Собирать Docker-образы
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schedule_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schedule_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      SOLVER_MODE: heuristic
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Установка зависимостей
        run: npm ci
      - name: Генерация Prisma Client
        run: npx prisma generate
        working-directory: apps/backend
      - name: ESLint
        run: npm run lint -w apps/backend
      - name: Prettier
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
        working-directory: apps/backend
      - name: Проверка типов
        run: npm run typecheck -w apps/backend
      - name: Модульные тесты
        run: npm test -w apps/backend -- --ci
      - name: E2E-тесты (PostgreSQL + Redis)
        run: npm run test:e2e -w apps/backend
      - name: Проверка миграций (схема совпадает с миграциями)
        working-directory: apps/backend
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE schedule_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/schedule_shadow" --exit-code

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Установка зависимостей
        run: npm ci
      - name: ESLint
        run: npm run lint -w apps/frontend
      - name: Проверка типов
        run: npm run typecheck -w apps/frontend
      - name: Модульные тесты
        run: npm test -w apps/frontend
      - name: Сборка
        run: npm run build -w apps/frontend

  solver:
    name: Solver (OR-Tools CP-SAT)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/solver
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/solver/requirements*.txt
      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt
      - name: Ruff (линтер и форматирование)
        run: |
          ruff check .
          ruff format --check .
      - name: Тесты
        run: pytest -q

  docker:
    name: Docker (${{ matrix.image }})
    if: ${{ inputs.docker != false }}
    needs: [backend, frontend, solver]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            file: apps/backend/Dockerfile
          - image: frontend
            context: .
            file: apps/frontend/Dockerfile
          - image: solver
            context: apps/solver
            file: apps/solver/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
